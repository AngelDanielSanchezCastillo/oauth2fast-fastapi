[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oauth2fast-fastapi"
dynamic = ["version"]
description = "Fast and secure OAuth2 authentication module for FastAPI with email verification"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Angel Daniel Sanchez Castillo", email = "angeldaniel.sanchezcastillo@gmail.com"}
]
keywords = ["fastapi", "oauth2", "authentication", "jwt", "email-verification", "sqlmodel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # External modules (include their own dependencies)
    # Databases. Exact pin: 0.5.0 ships the shared Alembic runner/env/registry
    # that the oauth chain depends on (alembic-2fast change).
    "pgsqlasync2fast-fastapi>=0.5.2",
    # Exact pin per the alembic-2fast migration change: deliberate re-pins
    # require a version bump and a full test run. Never use a range here.
    "alembic>=1.20.0",
    # Mailing
    "mailing2fast-fastapi>=0.2.3",
    # Logging
    "log2fast-fastapi>=0.1.3",
    # Tools
    "tools2fast-fastapi>=0.3.14",
    # JWT and authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=25.0.0",  # Required for Argon2 password hashing
    # Form data handling
    "python-multipart>=0.0.6",
    # SQLModel: required for UTCDateTime and AutoString in migrations
    "sqlmodel>=0.0.50",
]

[dependency-groups]
dev = [
    "black",
    "ruff",
    "mypy>=1.0.0",
    "pre-commit",
    "build",
    "twine",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/AngelDanielSanchezCastillo/oauth2fast-fastapi"
Documentation = "https://github.com/AngelDanielSanchezCastillo/oauth2fast-fastapi/tree/main/docs"
Repository = "https://github.com/AngelDanielSanchezCastillo/oauth2fast-fastapi"
Issues = "https://github.com/AngelDanielSanchezCastillo/oauth2fast-fastapi/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["oauth2fast_fastapi*"]

# Single source of truth for the version: __version__.py
[tool.setuptools.dynamic]
version = {attr = "oauth2fast_fastapi.__version__.__version__"}

[tool.setuptools.package-data]
oauth2fast_fastapi = [
    "skills/*.md",
    # Package-owned Alembic chain (alembic-2fast): shipped in the wheel and
    # resolved from the installed release, never a checkout.
    "migrations/**/*.py",
    "migrations/**/*.mako",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
